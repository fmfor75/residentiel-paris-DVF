name: Mise à jour DVF

on:
  schedule:
    # Mensuel : DGFiP publie en avril (données au 31/12 N-1) et en octobre (au 30/06 N), puis Etalab
    # régénère geo-dvf quelques semaines plus tard (18 mai en 2026). Un calendrier semestriel fixe
    # ratait cette régénération. Le script compare l'empreinte de chaque source (Last-Modified + taille)
    # à celle du run précédent et s'arrête sans rien écrire si rien n'a changé : un run à vide coûte
    # ~2 min et ne produit aucun commit.
    - cron: '0 6 1 * *'
  workflow_dispatch:
    inputs:
      mode:
        description: "probe = sonder les sources et relever colonnes/volumes sans rien écrire · full = run complet"
        type: choice
        options: [full, probe, encrypt]
        default: full
      allow_partial:
        description: "Années à publier malgré une source partielle/creuse, ex. 2019,2020 (vide = aucune)"
        type: string
        default: ""
      no_cache:
        description: "Ignorer le cache dvf_cache.json.gz (retélécharge tout, ~30–60 min)"
        type: boolean
        default: false
      force:
        description: "Recalculer et réécrire le JSON même si aucune source n'a changé"
        type: boolean
        default: false

concurrency:
  group: dvf-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Dépendances
        run: pip install requests cryptography

      # La suite de tests tourne sur un jeu de données jetable : elle prouve que le code est correct,
      # pas que les sources réelles ont le format attendu — c'est le run réel qui le prouve.
      - name: Tests bout en bout (fixtures)
        run: python -m unittest tests.test_pipeline tests.test_build_site tests.test_macro tests.test_loyers -v

      # Lot 7 : séries macro (BCE, INSEE) pour l'onglet Perspectives — publiques, en clair, une série en échec est
      # conservée depuis le fichier précédent et marquée ; le fichier n'est réécrit que si les données changent.
      - name: Séries macro (BCE, INSEE)
        run: python scripts/fetch_macro.py ${{ github.event.inputs.mode == 'probe' && '--probe' || '' }}

      # Lot 8 : encadrement des loyers Paris (Ville de Paris) + carte des loyers (data.gouv) → data/loyers.json
      - name: Loyers (encadrement Paris, carte des loyers)
        run: python scripts/fetch_loyers.py ${{ github.event.inputs.mode == 'probe' && '--probe' || '' }}

      - name: Sondage des sources (probe)
        if: ${{ github.event.inputs.mode == 'probe' }}
        run: python scripts/process_dvf.py --probe

      - name: Traitement DVF
        if: ${{ github.event.inputs.mode != 'probe' }}
        # mode encrypt : le pipeline tourne aussi (le JSON n'est plus commité, il est recalculé depuis le cache en ~1 min)
        env:
          DVF_ALLOW_PARTIAL: ${{ github.event.inputs.allow_partial }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.no_cache }}" = "true" ]; then ARGS="$ARGS --no-cache"; fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          python scripts/process_dvf.py $ARGS

      - name: Vérification du JSON produit
        if: ${{ github.event.inputs.mode != 'probe' }}
        run: |
          ls -lh data/
          python - <<'EOF'
          import json
          d = json.load(open('data/dvf_paris.json', encoding='utf-8')); m = d['meta']
          print(f"OK — {m['total_mutations']:,} mutations | {m['periode']} | dernière mutation {m['last_date']} | parser v{m['parser_version']} | fichiers téléchargés ce run : {m.get('fichiers_telecharges')}")
          for k, s in sorted(m['sources_used'].items()):
              print(f"  {k}: {s['count']:>7,}  {s['tag']}{'' if s['complet'] else '  (PARTIEL)'}")
          EOF

      # Lots 4 et 6 : le navigateur recalcule tout depuis sales.bin ; on prouve à chaque run que le moteur JS
      # donne les mêmes chiffres que le pipeline (28 000 comparaisons) et que la valorisation est cohérente.
      - name: Parité moteur navigateur / pipeline (Node)
        if: ${{ github.event.inputs.mode != 'probe' }}
        run: node tests/test_engine.mjs && node tests/test_valo.mjs

      # Lot 3 : les statistiques servies au dashboard sont chiffrées avec le code d'accès (secret DVF_CODE).
      # dvf_paris.json n'est plus commité ; seuls data/enc/*.bin et le manifest le sont.
      - name: Chiffrement des données servies
        if: ${{ github.event.inputs.mode != 'probe' }}
        env:
          DVF_CODE: ${{ secrets.DVF_CODE }}
        run: python scripts/build_site.py

      - name: Commit et push
        if: ${{ github.event.inputs.mode != 'probe' }}
        run: |
          git config user.name "DVF Bot"
          git config user.email "dvf-bot@github-actions"
          git add data/enc data/dvf_cache.json.gz data/macro.json data/loyers.json
          git status --short data/
          PERIODE=$(python -c "import json; print(json.load(open('data/dvf_paris.json'))['meta']['periode'])")
          git diff --staged --quiet || git commit -m "DVF $(date +'%Y-%m-%d') — ${PERIODE}"
          git push
